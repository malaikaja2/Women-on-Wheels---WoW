<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9a48ff">
  <title>Driver Profile - Women on Wheels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/driver-nav.css?v=20260412-3">
  <script src="js/wow-role-guard.js?v=20260411-1"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Manrope","Segoe UI",Tahoma,sans-serif;min-height:100vh;padding:16px;background:radial-gradient(circle at top left,rgba(240,106,165,.16),transparent 28%),radial-gradient(circle at top right,rgba(154,72,255,.14),transparent 24%),linear-gradient(180deg,#fff8fe 0%,#f7f1fb 48%,#f2ebfa 100%);color:#28153b}
    .shell{width:min(960px,100%);margin:0 auto;display:grid;gap:16px}
    .hero{background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%);color:#fff;border-radius:28px;padding:18px 20px;box-shadow:0 18px 40px rgba(112,53,178,.14)}
    .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    .back-btn,.link-btn{border:none;border-radius:16px;font-weight:800;cursor:pointer}
    .back-btn{background:rgba(255,255,255,.16);color:#fff;padding:12px 14px}
    .link-btn{background:#fff;color:#9a48ff;padding:12px 14px;text-decoration:none}
    .hero strong{display:block;font-size:26px;margin-top:2px}
    .card{background:rgba(255,255,255,.92);border:1px solid rgba(154,72,255,.14);border-radius:24px;box-shadow:0 18px 40px rgba(112,53,178,.08);padding:18px}
    .profile-box{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#fff;border:1px solid rgba(154,72,255,.1)}
    .avatar{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%)}
    .meta{display:grid;gap:10px;margin-top:14px}
    .meta > div{padding:12px 14px;border-radius:16px;background:rgba(154,72,255,.06);border:1px solid rgba(154,72,255,.08)}
    .meta span{display:block;color:#7d6a91;font-size:12px}
    .meta strong{display:block;margin-top:4px}
  </style>
</head>
<body data-driver-page="profile">
  <main class="shell">
    <section class="hero">
      <div class="top">
        <button class="back-btn" type="button" data-driver-back data-fallback="driver-dashboard.html">
          <span class="back-icon">&#8592;</span>
          <span class="back-text">Back</span>
        </button>
        <div><span>Women on Wheels</span><strong>Driver Profile</strong></div>
        <a class="link-btn" href="driver-dashboard.html">Dashboard</a>
      </div>
    </section>

    <section class="card">
      <div class="profile-box">
        <div class="avatar" id="profileInitial">D</div>
        <div>
          <strong id="profileName">Driver</strong>
          <span id="profileEmail" style="color:#7d6a91">driver@wow.com</span>
        </div>
      </div>
      <div class="meta">
        <div><span>Status</span><strong id="profileStatus">Online</strong></div>
        <div><span>Vehicle</span><strong id="driverVehicle">Suzuki Alto</strong></div>
        <div><span>Type</span><strong id="driverType">Car</strong></div>
        <div><span>Plate</span><strong id="driverPlate">ABC-1234</strong></div>
        <div><span>Rating</span><strong id="profileRating">4.9/5</strong></div>
      </div>
    </section>
  </main>

  <div data-driver-nav-mount></div>
  <script src="js/driver-nav.js?v=20260412-3"></script>
  <script>
    const name = localStorage.getItem("wow_user_name") || "Driver";
    const email = localStorage.getItem("wow_user_email") || "driver@wow.com";
    const vehicle = localStorage.getItem("wow_driver_vehicle") || "Suzuki Alto";
    const type = localStorage.getItem("wow_driver_vehicle_type") || "Car";
    const plate = localStorage.getItem("wow_driver_plate") || "ABC-1234";
    const rating = localStorage.getItem("wow_driver_rating") || "4.9";
    const initial = name.trim().charAt(0).toUpperCase() || "D";
    document.getElementById("profileInitial").textContent = initial;
    document.getElementById("profileName").textContent = name;
    document.getElementById("profileEmail").textContent = email;
    document.getElementById("driverVehicle").textContent = vehicle;
    document.getElementById("driverType").textContent = type;
    document.getElementById("driverPlate").textContent = plate;
    document.getElementById("profileRating").textContent = `${rating}/5`;
  </script>
</body>
</html>
