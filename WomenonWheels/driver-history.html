<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9a48ff">
  <title>Ride History - Women on Wheels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/driver-nav.css?v=20260412-3">
  <script src="js/wow-role-guard.js?v=20260411-1"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Manrope","Segoe UI",Tahoma,sans-serif;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(240,106,165,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(154,72,255,.16), transparent 24%),
        linear-gradient(180deg,#fff8fe 0%,#f7f1fb 48%,#f2ebfa 100%);
      color:#28153b;
      padding:16px 16px 110px;
    }
    .shell{width:min(1080px,100%);margin:0 auto;display:grid;gap:16px}
    .hero{
      background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%);
      color:#fff;border-radius:28px;padding:18px 20px;
      box-shadow:0 18px 40px rgba(112,53,178,.14)
    }
    .hero-copy{margin-top:12px;max-width:62ch;line-height:1.6;color:rgba(255,255,255,.9);font-size:13px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .back-btn,.link-btn{
      border:none;border-radius:16px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center
    }
    .link-btn{background:#fff;color:#9a48ff;padding:12px 14px}
    .hero strong{display:block;font-size:26px;margin-top:2px}
    .hero span{display:block;opacity:.88;font-size:12px}
    .card{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(154,72,255,.14);
      border-radius:24px;
      box-shadow:0 18px 40px rgba(112,53,178,.08);
      padding:18px
    }
    .history-list{display:grid;gap:12px}
    .item{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid rgba(154,72,255,.1)}
    .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    .top strong{font-size:15px}
    .top span{color:#7d6a91;font-size:13px}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;color:#7d6a91;font-size:13px}
    .meta strong{display:block;color:#28153b;margin-top:4px}
    .badge{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}
    .badge.cash{background:rgba(240,106,165,.12);color:#d64a85}
    .badge.online{background:rgba(154,72,255,.12);color:#7d43e8}
    .empty-state{
      padding:18px;border-radius:18px;border:1px dashed rgba(154,72,255,.18);
      background:rgba(255,255,255,.68);color:#7d6a91
    }
    @media(max-width:760px){.meta{grid-template-columns:1fr}}
  </style>
</head>
<body data-driver-page="history">
  <main class="shell">
    <section class="hero">
      <div class="row">
        <button class="back-btn" type="button" data-driver-back data-fallback="driver-dashboard.html">
          <span class="back-icon">&#8592;</span>
          <span class="back-text">Back</span>
        </button>
        <div>
          <span>Women on Wheels</span>
          <strong>Ride History</strong>
        </div>
        <a class="link-btn" href="driver-earnings.html">Earnings</a>
      </div>
      <p class="hero-copy">Review completed trips with fare, distance, and payment type. Cash and online rides stay separated for clearer earnings tracking.</p>
    </section>

    <section class="card">
      <div class="row" style="margin-bottom:14px">
        <div>
          <h2 style="font-size:20px">Completed trips</h2>
          <p style="color:#7d6a91;font-size:13px;margin-top:4px">Stored ride history from your completed driver trips.</p>
        </div>
        <a class="link-btn" href="driver-dashboard.html">Dashboard</a>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <div data-driver-nav-mount></div>
  <script src="js/driver-wallet.js?v=20260412-1"></script>
  <script src="js/driver-nav.js?v=20260412-3"></script>
  <script>
    const money = n => "Rs. " + Number(n || 0).toLocaleString("en-PK");
    const history = window.DriverWallet ? window.DriverWallet.getHistory() : [];
    const list = document.getElementById("historyList");

    function paymentBadge(method) {
      return method === "cash"
        ? '<span class="badge cash">Cash</span>'
        : '<span class="badge online">Online</span>';
    }

    if (!history.length) {
      list.innerHTML = '<div class="empty-state">No completed rides yet.</div>';
    } else {
      history.slice().reverse().forEach(item => {
        const row = document.createElement("article");
        row.className = "item";
        row.innerHTML = `
          <div class="top">
            <strong>${item.passenger}</strong>
            <span>${item.dateTime}</span>
          </div>
          <div class="meta">
            <span>Fare <strong>${money(item.fare)}</strong></span>
            <span>Distance <strong>${item.distance}</strong></span>
            <span>Payment <strong>${paymentBadge(item.paymentMethod)}</strong></span>
          </div>`;
        list.appendChild(row);
      });
    }
  </script>
</body>
</html>
