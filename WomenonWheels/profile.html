<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9a48ff">
  <title>Passenger Profile</title>
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/passenger-unified.css?v=20260412-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="js/wow-role-guard.js?v=20260411-1"></script>
</head>
<body class="passenger-shell">
  <header class="profile-header">
    <button class="back-btn" type="button" onclick="history.back()">
      <span class="back-icon">&#8592;</span>
      <span class="back-text">Back</span>
    </button>
    <strong>Passenger Profile</strong>
  </header>

  <main class="profile-main">
    <div class="profile-card">
      <div class="avatar">AS</div>
      <div>
        <strong id="profileName">Guest</strong>
        <span id="profileEmail">guest@wow.com</span>
      </div>
    </div>

    <div class="profile-info">
      <div>
        <span>Role</span>
        <strong id="profileRole">Passenger</strong>
      </div>
      <div>
        <span>Member Since</span>
        <strong>2026</strong>
      </div>
    </div>

    <div class="profile-actions">
      <button class="primary">Edit Profile</button>
      <button class="outline" onclick="location.href='login.html'">Log Out</button>
    </div>
  </main>

  <script>
    const storedName = localStorage.getItem('wow_user_name') || '';
    const storedEmail = localStorage.getItem('wow_user_email') || 'guest@wow.com';
    const storedRole = localStorage.getItem('wow_user_role') || 'passenger';
    const name = storedName || storedEmail.split('@')[0] || 'Guest';
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = storedEmail;
    document.getElementById('profileRole').textContent = storedRole.charAt(0).toUpperCase() + storedRole.slice(1);
  </script>
</body>
</html>
