<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9a48ff">
  <title>Chat - Women on Wheels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Manrope","Segoe UI",Tahoma,sans-serif;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(240,106,165,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(154,72,255,.16), transparent 24%),
        linear-gradient(180deg,#fff8fe 0%,#f7f1fb 48%,#f2ebfa 100%);
      color:#28153b;
      padding:16px;
    }
    a{color:inherit;text-decoration:none}
    .shell{width:min(920px,100%);margin:0 auto;display:grid;gap:16px}
    .hero{
      background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%);
      color:#fff;
      border-radius:28px;
      padding:18px 20px;
      box-shadow:0 18px 40px rgba(112,53,178,.14);
    }
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .back-btn,.pill-btn,.send-btn{
      border:none;border-radius:16px;font-weight:800;cursor:pointer
    }
    .back-btn{
      background:rgba(255,255,255,.16);
      color:#fff;
      padding:12px 14px;
    }
    .title small{display:block;opacity:.86;font-size:12px}
    .title strong{display:block;font-size:24px;margin-top:2px}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap}
    .pill-btn{
      background:#fff;color:#9a48ff;padding:12px 14px;min-width:120px
    }
    .card{
      background:rgba(255,255,255,.9);
      border:1px solid rgba(154,72,255,.14);
      border-radius:24px;
      box-shadow:0 18px 40px rgba(112,53,178,.08);
    }
    .chat-card{display:grid;min-height:68vh}
    .chat-head{
      padding:16px 18px;
      border-bottom:1px solid rgba(154,72,255,.08);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
    }
    .chat-head strong{font-size:18px}
    .chat-head span{color:#7d6a91;font-size:13px}
    .thread{padding:18px;display:grid;gap:10px;align-content:start;overflow:auto}
    .bubble{
      max-width:78%;
      padding:10px 12px;
      border-radius:16px;
      line-height:1.45;
      font-size:14px;
    }
    .bubble.me{margin-left:auto;background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%);color:#fff}
    .bubble.them{background:rgba(154,72,255,.08)}
    .composer{
      padding:16px 18px 18px;
      border-top:1px solid rgba(154,72,255,.08);
      display:flex;gap:10px
    }
    .composer input{
      flex:1;min-height:48px;border-radius:16px;border:1px solid rgba(154,72,255,.14);
      padding:0 14px;background:#fff;color:#28153b
    }
    .send-btn{
      min-height:48px;padding:0 16px;
      background:linear-gradient(135deg,#9a48ff 0%,#f06aa5 100%);
      color:#fff
    }
    .meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .meta{padding:16px 18px}
    .meta span{display:block;color:#7d6a91;font-size:12px}
    .meta strong{display:block;margin-top:6px;font-size:16px}
    @media(max-width:760px){
      .meta-grid{grid-template-columns:1fr}
      .composer{flex-direction:column}
      .bubble{max-width:90%}
    }
  </style>
  <link rel="stylesheet" href="css/passenger-unified.css?v=20260728-nav2">
<link rel="stylesheet" href="css/passenger-chatbot.css?v=20260722-intent1"></head>
<body class="passenger-shell">
  <main class="shell">
    <section class="hero">
      <div class="top">
        <button class="back-btn" type="button" onclick="history.back()">← Back</button>
        <div class="title">
          <small>Women on Wheels</small>
          <strong>Chat</strong>
        </div>
        <div class="hero-actions">
          <button class="pill-btn" type="button" id="openRideBtn">Ride Tracking</button>
          <button class="pill-btn" type="button" onclick="location.href='help.html'">Help</button>
        </div>
      </div>
    </section>

    <section class="meta-grid">
      <article class="card meta">
        <span>Passenger</span>
        <strong id="chatPassenger">Passenger</strong>
      </article>
      <article class="card meta">
        <span>Driver</span>
        <strong id="chatDriver">Driver</strong>
      </article>
      <article class="card meta">
        <span>Ride Code</span>
        <strong id="chatCode">WOW-000</strong>
      </article>
    </section>

    <section class="card chat-card">
      <div class="chat-head">
        <div>
          <strong id="chatTitle">Live conversation</strong>
          <span id="chatSubtitle">Only available during an active ride</span>
        </div>
      </div>
      <div class="thread" id="chatThread"></div>
      <div class="composer">
        <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" id="sendBtn" type="button">Send</button>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const name = localStorage.getItem("wow_ride_passenger") || "Passenger";
    const driver = localStorage.getItem("wow_ride_driver_name") || localStorage.getItem("wow_user_name") || "Driver";
    const code = localStorage.getItem("wow_ride_code") || "WOW-000";
    const role = (localStorage.getItem("wow_user_role") || "passenger").toLowerCase();
    const rideRoute = role === "driver" ? "driver-ride.html" : "passenger-ride.html";
    const currentUser = role === "driver" ? driver : (localStorage.getItem("wow_user_name") || "Passenger");
    const otherParty = role === "driver" ? name : driver;
    const storageKey = "wow_chat_log_" + code;

    $("chatPassenger").textContent = name;
    $("chatDriver").textContent = driver;
    $("chatCode").textContent = code;
    $("chatTitle").textContent = otherParty;
    $("chatSubtitle").textContent = localStorage.getItem("wow_ride_pickup") ? "Active ride conversation" : "No active ride found";
    $("openRideBtn").addEventListener("click", () => location.href = rideRoute);

    function readLog() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "[]");
      } catch {
        return [];
      }
    }

    function writeLog(log) {
      localStorage.setItem(storageKey, JSON.stringify(log.slice(-60)));
    }

    function render() {
      const thread = $("chatThread");
      thread.innerHTML = "";
      const log = readLog();
      if (!log.length) {
        const p = document.createElement("div");
        p.className = "bubble them";
        p.textContent = "Start the conversation for this ride.";
        thread.appendChild(p);
        return;
      }
      log.forEach(item => {
        const bubble = document.createElement("div");
        bubble.className = "bubble " + (item.author === currentUser ? "me" : "them");
        bubble.textContent = item.text;
        thread.appendChild(bubble);
      });
      thread.scrollTop = thread.scrollHeight;
    }

    function send() {
      const input = $("chatInput");
      const text = input.value.trim();
      if (!text) return;
      const log = readLog();
      log.push({ author: currentUser, text, time: Date.now() });
      if (log.length > 60) log.shift();
      writeLog(log);
      input.value = "";
      render();
      setTimeout(() => {
        const reply = role === "driver" ? "Thanks, I’m on my way." : "Got it, thanks for the update.";
        const updated = readLog();
        updated.push({ author: otherParty, text: reply, time: Date.now() });
        writeLog(updated);
        render();
      }, 800);
    }

    $("sendBtn").addEventListener("click", send);
    $("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    render();
  </script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="js/wow-firestore.js?v=20260722-intent1"></script><script src="js/passenger-chatbot.js?v=20260730-chatbot-fix1"></script></body>
</html>
