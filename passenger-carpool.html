<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a48ff">
<title>Live Carpool - Women on Wheels</title>
<link rel="stylesheet" href="css/dashboard.css?v=20260830-carpool2">
<link rel="stylesheet" href="css/passenger-unified.css?v=20260728-nav2">
<link rel="stylesheet" href="css/driver-nav.css?v=20260412-3">
<link rel="stylesheet" href="css/passenger-chatbot.css?v=20260706-chatbot2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="js/wow-role-guard.js?v=20260411-1"></script>
</head>
<body class="passenger-shell has-bottom-nav carpool-live-shell">
<main class="cp-shell">
  <section class="top-panel cp-top-panel">
    <div class="panel-title-row">
      <button class="back-btn" type="button" onclick="location.href='dashboard.html'">
        <span class="back-icon">&#8592;</span>
        <span class="back-text">Back</span>
      </button>
      <h2>Live Carpool</h2>
    </div>
    <div class="cp-hero">
      <span>Women-only shared ride</span>
      <strong id="cpSummary">Connecting to your booking...</strong>
    </div>
  </section>

  <section class="trip-card cp-card" id="cpMine" aria-live="polite">
    <div class="wow-carpool-state">Loading ride details...</div>
  </section>

  <section class="trip-card cp-card">
    <div class="wow-carpool-panel-head">
      <div>
        <h2>Shared stop order</h2>
        <p>Pickup progress updates when the driver starts handling the shared ride.</p>
      </div>
    </div>
    <div class="cp-stop-list" id="cpStops" aria-live="polite">
      <div class="wow-carpool-state">Calculating route...</div>
    </div>
  </section>

  <section class="trip-card cp-card">
    <h2>Driver</h2>
    <p class="cp-driver" id="cpDriver">Matching a verified driver...</p>
  </section>
</main>

<nav class="bottom-nav driver-bottom-nav" aria-label="Passenger navigation">
  <button class="nav-item" data-page="app-home.html" onclick="location.href='app-home.html'">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
      <path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path>
    </svg>
    <span>Home</span>
  </button>
  <button class="nav-item active" data-page="dashboard.html" onclick="location.href='dashboard.html'" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
      <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a2 2 0 1 1-4 0H11a2 2 0 1 1-4 0H6a1 1 0 0 1-1-1v-6Z"></path>
    </svg>
    <span>Book</span>
  </button>
  <button class="nav-item" data-page="help" onclick="location.href='help.html'">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 15a1 1 0 1 1 1-1 1 1 0 0 1-1 1Zm2.2-7.4-.7.6a2.7 2.7 0 0 0-.9 2.1v.2h-1.8v-.4a3.8 3.8 0 0 1 1.3-2.9l.9-.8a1.8 1.8 0 1 0-3.1-1.3H7.9a3.6 3.6 0 1 1 6.3 2.5Z"></path>
    </svg>
    <span>Help</span>
  </button>
  <button class="nav-item" data-page="app-home.html" onclick="localStorage.setItem('wow_open_profile','1');location.href='app-home.html'">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
      <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2-8 4v2h16v-2c0-2-3.58-4-8-4Z"></path>
    </svg>
    <span>Profile</span>
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/wow-firestore.js?v=20260711-rides1"></script>
<script src="js/passenger-chatbot.js?v=20260730-chatbot-fix1"></script>
<script src="js/passenger-navigation.js?v=20260803-live-notifications1"></script>
<script src="js/passenger-carpool.js?v=20260906-carpool-read1"></script>
</body>
</html>
