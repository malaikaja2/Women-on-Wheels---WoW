<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9a48ff">
  <title>Login - Women on Wheels</title>
  <link rel="stylesheet" href="css/signup.css?v=20260905-google1">
  <link rel="stylesheet" href="css/wow-forgot-password.css?v=20260730-1">
</head>
<body>
  <div class="signup-box">
    <div class="form-logo"><img src="images/logo.png" alt="Women on Wheels"></div>
    <h2>Login</h2>

    <div class="role-buttons">
      <button type="button" class="role-btn" data-role="passenger" onclick="showLoginForm('passenger')">Login as Passenger</button>
      <button type="button" class="role-btn" data-role="driver" onclick="showLoginForm('driver')">Login as Driver</button>
    </div>
    <div class="auth-message" id="authMessage" role="alert" aria-live="polite"></div>

    <form id="passenger-login" action="php/login.php" method="POST">
      <input type="hidden" name="role" value="passenger">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="button" class="wow-forgot-link" data-wow-forgot-password data-email-selector="#passenger-login input[name='email']" data-return-label="Return to Passenger Login">Forgot Password?</button>
      <button type="submit">Login</button>
      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="google-login-btn" id="passengerGoogleLogin">
        <span class="google-mark" aria-hidden="true">G</span>
        <span>Continue with Google</span>
      </button>
    </form>

    <form id="driver-login" action="php/login.php" method="POST">
      <input type="hidden" name="role" value="driver">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="button" class="wow-forgot-link" data-wow-forgot-password data-email-selector="#driver-login input[name='email']" data-return-label="Return to Driver Login">Forgot Password?</button>
      <button type="submit">Login</button>
    </form>

    <p class="login-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/login.js?v=20260905-google1"></script>
  <script src="js/wow-forgot-password.js?v=20260730-1"></script>
</body>
</html>
